---
- name: Instalar bind9
  ansible.builtin.apt:
    name: [bind9, bind9utils, dnsutils]
    state: present
    update_cache: true

- name: named.conf.local (slave)
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    mode: '0644'
  notify: Restart bind9

- name: Permisos dir cache
  ansible.builtin.file:
    path: /var/cache/bind
    state: directory
    owner: bind
    group: bind
    mode: '0775'

- name: bind9 activo
  ansible.builtin.service:
    name: bind9
    enabled: true
    state: started
